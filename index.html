
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哼唱→钢琴演奏（干净版）</title>
<style>
body{background:#111;color:#eee;font-family:sans-serif;text-align:center;padding:30px;}
button{padding:10px 18px;margin:5px;font-size:16px;cursor:pointer;}
#info{margin-top:20px;font-size:18px;}
.note{display:inline-block;padding:5px 10px;margin:3px;border-radius:4px;background:#333;}
.note.active{background:#f90;color:#000;font-weight:bold;}
#status{margin-top:10px;font-size:18px;color:#ff0;}
</style>
</head>
<body>
<h1>哼唱→钢琴演奏（干净版）</h1>
<button id="start">🎤 开始录音</button>
<button id="stop">⏹ 停止录音</button>
<button id="play">▶ 回放钢琴</button>

<div id="status">准备中…</div>

<div id="info">
  <div>检测音符: <span id="currentNote">-</span></div>
  <div>当前音节: <span id="currentPitchClass">-</span></div>
  <div>推测调式: <span id="currentScale">-</span></div>
  <div>推测和弦: <span id="currentChord">-</span></div>
</div>
<div id="melodyDisplay"></div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const actx = new AudioContext();

let recordedMelody=[], isRecording=false, mediaStream, mediaRecorder, audioChunks=[];
const noteNames=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
let minRMS = 0.03; // 声音阈值，低于此忽略

function noteToFreq(note){
  const map={C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
  let octave=parseInt(note.slice(-1));
  let key=note.slice(0,-1);
  let midi = 12 + octave*12 + map[key];
  return 440 * Math.pow(2,(midi-69)/12);
}

// 改进自相关音高检测 + 阈值
function autoCorrelate(buf,sampleRate){
  let SIZE=buf.length;
  let rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<minRMS) return null;

  let r=new Array(SIZE).fill(0);
  for(let t=0;t<SIZE;t++)
    for(let i=0;i<SIZE-t;i++)
      r[t]+=buf[i]*buf[i+t];
  for(let i=1;i<SIZE-1;i++)
    r[i]=(r[i-1]+r[i]+r[i+1])/3;

  let d=0; while(r[d]>r[d+1] && d<SIZE) d++;
  let maxval=-1,maxpos=-1;
  for(let i=d;i<SIZE;i++){
    if(r[i]>maxval){maxval=r[i];maxpos=i;}
  }
  if(!maxpos) return null;
  return sampleRate/maxpos;
}

function freqToNote(freq){
  let midi=Math.round(12*Math.log2(freq/440)+69);
  let note=noteNames[midi%12]+Math.floor(midi/12);
  return note;
}

// 调式推测
function guessScale(melody){
  if(melody.length===0) return "-";
  const pitchCount = {};
  melody.forEach(n=>{
    let pitch = n.note.replace(/\d/,''); 
    pitchCount[pitch] = (pitchCount[pitch]||0)+1;
  });

  const scales = {
      "C大调":["C","D","E","F","G","A","B"],
      "A小调":["A","B","C","D","E","F","G"],
      "G大调":["G","A","B","C","D","E","F#"],
      "D大调":["D","E","F#","G","A","B","C#"],
      "E小调":["E","F#","G","A","B","C","D"],
  };

  let bestScale="-",bestScore=-1;
  for(const scaleName in scales){
      const scale= scales[scaleName];
      let score=0;
      for(const pitch in pitchCount){
          if(scale.includes(pitch)) score += pitchCount[pitch];
      }
      if(score>bestScore){bestScore=score; bestScale=scaleName;}
  }
  return bestScale;
}

// 和弦识别
const chordTable = {
  "C":["C","E","G"],
  "Dmin":["D","F","A"],
  "Emin":["E","G","B"],
  "F":["F","A","C"],
  "G":["G","B","D"],
  "Amin":["A","C","E"],
  "Bdim":["B","D","F"],
};
function guessChord(melody){
  if(melody.length<3) return "-";
  const last3 = melody.slice(-3).map(n=>n.note.replace(/\d/,''));
  for(const chord in chordTable){
      const notes = chordTable[chord];
      if(last3.every(n=>notes.includes(n))) return chord;
  }
  return last3.join("-")+"（未知和弦）";
}

function updateMelodyDisplay(){
  const div=document.getElementById("melodyDisplay");
  div.innerHTML="";
  recordedMelody.forEach(n=>{
    const span=document.createElement('span');
    span.className='note';
    span.textContent=n.note;
    div.appendChild(span);
  });
}

// 真正开始录音
async function startRecording(){
  if(actx.state==="suspended") await actx.resume();
  mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder=new MediaRecorder(mediaStream);
  audioChunks=[];
  recordedMelody=[];
  mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
  mediaRecorder.start();
  isRecording=true;

  document.getElementById("currentNote").textContent="-";
  document.getElementById("currentPitchClass").textContent="-";
  document.getElementById("currentScale").textContent="-";
  document.getElementById("currentChord").textContent="-";
  document.getElementById("melodyDisplay").innerHTML="";

  const source=actx.createMediaStreamSource(mediaStream);
  const analyser=actx.createAnalyser();
  analyser.fftSize=2048;
  source.connect(analyser);
  const dataArray=new Float32Array(analyser.fftSize);

  function detectPitch(){
    if(!isRecording) return;
    analyser.getFloatTimeDomainData(dataArray);
    let pitch=autoCorrelate(dataArray,actx.sampleRate);
    if(pitch){
      let note=freqToNote(pitch);
      let pitchClass=note.replace(/\d/,"");
      recordedMelody.push({note,duration:500});
      document.getElementById("currentNote").textContent=note;
      document.getElementById("currentPitchClass").textContent=pitchClass;
      document.getElementById("currentScale").textContent=guessScale(recordedMelody);
      document.getElementById("currentChord").textContent=guessChord(recordedMelody);
      updateMelodyDisplay();
    }
    requestAnimationFrame(detectPitch);
  }
  detectPitch();
}

// 倒计时启动录音
async function startRecordingWithCountdown(){
  const status=document.getElementById("status");
  for(let i=3;i>0;i--){
    status.textContent="准备录音："+i;
    await new Promise(r=>setTimeout(r,1000));
  }
  status.textContent="录音中…";
  startRecording();
}

// 停止录音
document.getElementById("stop").onclick=()=>{
  isRecording=false;
  mediaRecorder.stop();
  mediaStream.getTracks().forEach(t=>t.stop());
  document.getElementById("status").textContent="录音结束";
};

// 回放钢琴
document.getElementById("play").onclick=async()=>{
  document.getElementById("status").textContent="回放中…";
  for(let i=0;i<recordedMelody.length;i++){
    const n=recordedMelody[i];
    const osc=actx.createOscillator();
    const gain=actx.createGain();
    osc.type='sine'; // 钢琴近似
    osc.frequency.value=noteToFreq(n.note);
    gain.gain.setValueAtTime(0,actx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3,actx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+n.duration/1000);
    osc.connect(gain).connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime+n.duration/1000+0.05);
    await new Promise(r=>setTimeout(r,n.duration));
  }
  document.getElementById("status").textContent="回放结束";
};

// 绑定按钮
document.getElementById("start").onclick=startRecordingWithCountdown;
</script>
</body>
</html>
