
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>哼唱定音 → 自动小提琴演奏</title>
<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #f2f2f2;
  font-family: system-ui;
}
#ui {
  padding: 12px;
}
button {
  margin-right: 8px;
  padding: 6px 12px;
}
#note {
  font-size: 32px;
  margin-top: 8px;
}
#stable {
  height: 6px;
  background: #333;
  margin-top: 6px;
}
#stable > div {
  height: 100%;
  width: 0%;
  background: #6cff8f;
}
#stage {
  height: calc(100vh - 130px);
}
</style>
</head>
<body>

<div id="ui">
  <button id="startRec">🎤 开始哼唱</button>
  <button id="stopRec">⏹ 停止</button>
  <button id="play">🎻 自动拉琴</button>
  <div id="note">—</div>
  <div id="stable"><div></div></div>
</div>

<div id="stage"></div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>

<script>
/* ================== 工具 ================== */
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function freqToNote(freq) {
  const n = Math.round(12 * Math.log2(freq / 440) + 69);
  return { name: NOTE_NAMES[n % 12], midi: n };
}
function midiToFreq(n) {
  return 440 * Math.pow(2, (n - 69) / 12);
}

/* ================== 音高检测 ================== */
function autoCorrelate(buf, sr) {
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / buf.length) < 0.01) return -1;

  let c = new Array(buf.length).fill(0);
  for (let i = 0; i < buf.length; i++) {
    for (let j = 0; j < buf.length - i; j++) {
      c[i] += buf[j] * buf[j + i];
    }
  }
  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let max = d;
  for (let i = d; i < buf.length; i++) {
    if (c[i] > c[max]) max = i;
  }
  return sr / max;
}

/* ================== 录音逻辑 ================== */
let audioCtx, analyser, data;
let recording = false;
let melody = [];
let current = null;
let stableCount = 0;

const noteDiv = document.getElementById("note");
const stableBar = document.querySelector("#stable div");

startRec.onclick = async () => {
  melody = [];
  current = null;
  stableCount = 0;
  stableBar.style.width = "0%";

  audioCtx = new AudioContext();
  await audioCtx.resume();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  data = new Float32Array(analyser.fftSize);
  audioCtx.createMediaStreamSource(stream).connect(analyser);

  recording = true;
  detect();
};

stopRec.onclick = () => {
  recording = false;
  noteDiv.textContent = "完成：" + melody.map(n => n.name).join(" ");
};

function detect() {
  if (!recording) return;
  analyser.getFloatTimeDomainData(data);
  const freq = autoCorrelate(data, audioCtx.sampleRate);

  if (freq > 80 && freq < 1200) {
    const n = freqToNote(freq);
    noteDiv.textContent = n.name;

    if (!current || current.name !== n.name) {
      current = n;
      stableCount = 0;
    } else {
      stableCount++;
      stableBar.style.width = Math.min(stableCount * 10, 100) + "%";
      if (stableCount === 8) melody.push(n);
    }
  }
  requestAnimationFrame(detect);
}

/* ================== 小提琴音色（稳定版） ================== */
const actx = new AudioContext();
const osc = actx.createOscillator();
const filter = actx.createBiquadFilter();
const gain = actx.createGain();

osc.type = "sawtooth";
filter.type = "lowpass";
filter.frequency.value = 3000;
gain.gain.value = 0;

osc.connect(filter).connect(gain).connect(actx.destination);
osc.start();

/* ================== Three.js 3D 小提琴 ================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0b);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(5, 5, 5);
scene.add(light);

const violin = new THREE.Mesh(
  new THREE.CylinderGeometry(0.6, 0.7, 3, 32),
  new THREE.MeshStandardMaterial({ color: 0x6a3a1a })
);
violin.rotation.z = Math.PI / 2;
scene.add(violin);

/* ================== 自动拉琴 ================== */
let playIndex = 0;
let playTime = 0;
let playing = false;

play.onclick = async () => {
  if (!melody.length) return alert("没有旋律");
  await actx.resume();
  playIndex = 0;
  playTime = performance.now();
  playing = true;
};

function animate(t) {
  requestAnimationFrame(animate);

  if (playing) {
    const n = melody[playIndex];
    osc.frequency.setTargetAtTime(midiToFreq(n.midi), actx.currentTime, 0.03);
    gain.gain.setTargetAtTime(0.3, actx.currentTime, 0.05);

    if (t - playTime > 600) {
      playIndex++;
      playTime = t;
      if (playIndex >= melody.length) {
        gain.gain.value = 0;
        playing = false;
      }
    }
  }
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
