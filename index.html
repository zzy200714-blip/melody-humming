<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>哼唱成旋律（钢琴回放）</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:20px}
button{margin:5px;padding:10px 16px;font-size:16px}
#melody span{margin-right:6px}
</style>
</head>
<body>

<h2>🎤 哼唱 → 🎹 钢琴旋律</h2>

<button id="start">开始录音</button>
<button id="stop">停止</button>
<button id="play">回放</button>

<p id="status">等待</p>
<p id="pitch"></p>
<p id="key"></p>
<div id="melody"></div>

<script>
/* ========= 音频基础 ========= */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioCtx();

let micStream, analyser, data;
let recording = false;
let rafId;

/* ========= 旋律数据 ========= */
let recordedNotes = [];
let lastNote = null;

const FRAME_MS = 50;
const MIN_DURATION = 120;
const MIN_NOTE_MS = 120;

/* ========= 音名 ========= */
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

/* ========= UI ========= */
const statusEl = document.getElementById("status");
const pitchEl = document.getElementById("pitch");
const melodyEl = document.getElementById("melody");
const keyEl = document.getElementById("key");

document.getElementById("start").onclick = startRecording;
document.getElementById("stop").onclick = stopRecording;
document.getElementById("play").onclick = playRecorded;

/* ========= 音高工具 ========= */
function freqToMidi(freq){
  return Math.round(12 * Math.log2(freq / 440) + 69);
}
function midiToFreq(m){
  return 440 * Math.pow(2,(m-69)/12);
}
function midiName(m){
  return NOTE_NAMES[m % 12] + Math.floor(m/12 - 1);
}

/* ========= 旋律净化 ========= */
function pushNote(midi, dur){
  if(!lastNote){
    lastNote = {midi, dur};
    return;
  }
  if(Math.abs(lastNote.midi - midi) < 0.5){
    lastNote.dur += dur;
  }else{
    if(lastNote.dur >= MIN_DURATION){
      recordedNotes.push(lastNote);
    }
    lastNote = {midi, dur};
  }
}

/* ========= 录音 ========= */
async function startRecording(){
  if(ctx.state === "suspended") await ctx.resume();
  recordedNotes = [];
  lastNote = null;

  micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  const src = ctx.createMediaStreamSource(micStream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
  data = new Float32Array(analyser.fftSize);

  recording = true;
  statusEl.textContent = "录音中…";
  loop();
}

function stopRecording(){
  recording = false;
  if(micStream){
    micStream.getTracks().forEach(t=>t.stop());
    micStream = null;
  }
  if(lastNote && lastNote.dur >= MIN_DURATION){
    recordedNotes.push(lastNote);
    lastNote = null;
  }
  recordedNotes = recordedNotes.filter(n=>n.dur>=MIN_NOTE_MS);
  renderMelody();
  detectKey();
  statusEl.textContent = "已停止";
}

/* ========= 音高检测 ========= */
function detectPitch(){
  analyser.getFloatTimeDomainData(data);
  let rms = 0;
  for(let i=0;i<data.length;i++) rms += data[i]*data[i];
  rms = Math.sqrt(rms/data.length);
  if(rms < 0.01) return null;

  let best = -1, bestLag = -1;
  for(let lag=20;lag<1000;lag++){
    let sum=0;
    for(let i=0;i<1000;i++){
      sum += data[i]*data[i+lag];
    }
    if(sum>best){best=sum;bestLag=lag;}
  }
  return ctx.sampleRate / bestLag;
}

/* ========= 主循环 ========= */
function loop(){
  if(!recording) return;
  const freq = detectPitch();
  if(freq){
    const midi = freqToMidi(freq);
    pitchEl.textContent = "音高："+midiName(midi);
    pushNote(midi, FRAME_MS);
  }
  rafId = setTimeout(loop, FRAME_MS);
}

/* ========= 渲染 ========= */
function renderMelody(){
  melodyEl.innerHTML = "";
  recordedNotes.forEach(n=>{
    const s=document.createElement("span");
    s.textContent=midiName(n.midi);
    melodyEl.appendChild(s);
  });
}

/* ========= 回放 ========= */
function playRecorded(){
  let t = ctx.currentTime + 0.1;
  recordedNotes.forEach(n=>{
    playPiano(midiToFreq(n.midi), t, n.dur/1000);
    t += n.dur/1000;
  });
}

function playPiano(freq, time, dur){
  const g = ctx.createGain();
  g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(0.8,time+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur);

  [1,2,3].forEach((r,i)=>{
    const o=ctx.createOscillator();
    o.type="sine";
    o.frequency.setValueAtTime(freq*r,time);
    o.connect(g);
    o.start(time);
    o.stop(time+dur+0.05);
  });
}

/* ========= 调性检测 ========= */
function detectKey(){
  if(!recordedNotes.length) return;
  const MAJ=[0,2,4,5,7,9,11], MIN=[0,2,3,5,7,8,10];
  const hist=Array(12).fill(0);
  recordedNotes.forEach(n=>hist[n.midi%12]++);
  let best={score:-1};
  for(let t=0;t<12;t++){
    const maj=MAJ.reduce((s,x)=>s+hist[(t+x)%12],0);
    const min=MIN.reduce((s,x)=>s+hist[(t+x)%12],0);
    if(maj>best.score) best={t,mode:"大调",score:maj};
    if(min>best.score) best={t,mode:"小调",score:min};
  }
  keyEl.textContent=`调性：${NOTE_NAMES[best.t]} ${best.mode}`;
}
</script>
</body>
</html>
