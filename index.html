
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哼唱旋律 → 小提琴回放</title>
<style>
body {
  font-family: system-ui, sans-serif;
  padding: 24px;
}
button {
  padding: 8px 14px;
  margin-right: 8px;
}
#current {
  font-size: 20px;
  margin: 12px 0;
}
.note {
  display: inline-block;
  padding: 4px 6px;
  margin: 2px;
  background: #e5e7eb;
  border-radius: 4px;
}
</style>
</head>
<body>

<button id="start">开始录制</button>
<button id="stop">停止</button>
<button id="play">▶ 回放旋律</button>

<div id="current">当前频率：-</div>
<div id="melody"></div>

<script>
let audioCtx, analyser, data;
let recording = false;

let melody = [];
let currentFreq = null;
let freqStartTime = 0;
const STABLE_TIME = 120;

// === 音高检测（自相关）===
function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;

  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) {
      c[i] += buf[j] * buf[j + i];
    }
  }

  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxpos = d;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > c[maxpos]) maxpos = i;
  }
  return sampleRate / maxpos;
}

// === 更新检测 ===
function update() {
  if (!recording) return;

  analyser.getFloatTimeDomainData(data);
  const freq = autoCorrelate(data, audioCtx.sampleRate);

  if (freq > 60 && freq < 1200) {
    document.getElementById("current").textContent =
      `当前频率：${freq.toFixed(1)} Hz`;

    const now = performance.now();
    if (
      !currentFreq ||
      Math.abs(freq - currentFreq) / currentFreq > 0.05
    ) {
      if (currentFreq && now - freqStartTime > STABLE_TIME) {
        melody.push({
          freq: currentFreq,
          duration: now - freqStartTime
        });
        render();
      }
      currentFreq = freq;
      freqStartTime = now;
    }
  }
  requestAnimationFrame(update);
}

function render() {
  document.getElementById("melody").innerHTML =
    melody.map(n => `<span class="note">${n.freq.toFixed(0)}Hz</span>`).join("");
}

// === 按钮逻辑 ===
document.getElementById("start").onclick = async () => {
  melody = [];
  currentFreq = null;
  recording = true;
  document.getElementById("melody").innerHTML = "";

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioCtx.createMediaStreamSource(stream);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  data = new Float32Array(analyser.fftSize);

  source.connect(analyser);
  update();
};

document.getElementById("stop").onclick = () => {
  recording = false;
  const now = performance.now();
  if (currentFreq) {
    melody.push({
      freq: currentFreq,
      duration: now - freqStartTime
    });
    render();
  }
};

document.getElementById("play").onclick = async () => {
  if (melody.length === 0) return;

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();

  let t = ctx.currentTime;
  let lastFreq = melody[0].freq;

  melody.forEach(n => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(lastFreq, t);
    osc.frequency.linearRampToValueAtTime(n.freq, t + 0.05);

    filter.type = "lowpass";
    filter.frequency.value = 2000;

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.7, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      t + n.duration / 1000
    );

    osc.connect(filter).connect(gain).connect(ctx.destination);

    osc.start(t);
    osc.stop(t + n.duration / 1000);

    lastFreq = n.freq;
    t += n.duration / 1000;
  });
};
</script>

</body>
</html>
