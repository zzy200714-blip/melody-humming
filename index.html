<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>旋律记录</title>
<style>
body {
  font-family: system-ui, sans-serif;
  padding: 24px;
}
button {
  margin-right: 10px;
  padding: 8px 14px;
}
#current {
  font-size: 22px;
  margin: 12px 0;
}
#melody {
  margin-top: 20px;
  white-space: pre-wrap;
}
.note {
  display: inline-block;
  padding: 4px 6px;
  margin: 2px;
  border-radius: 4px;
  background: #e5e7eb;
}
</style>
</head>
<body>

<button id="start">开始录制</button>
<button id="stop">停止</button>

<div id="current">当前音符：-</div>
<div id="melody"></div>

<script>
let audioCtx, analyser, data;
let recording = false;

let melody = [];
let currentNote = null;
let noteStartTime = 0;
const STABLE_TIME = 150; // ms

function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;

  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) {
      c[i] += buf[j] * buf[j + i];
    }
  }

  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxpos = d;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > c[maxpos]) maxpos = i;
  }

  return sampleRate / maxpos;
}

function noteFromPitch(freq) {
  const A4 = 440;
  const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const n = Math.round(12 * Math.log2(freq / A4)) + 69;
  return names[n % 12];
}

function update() {
  if (!recording) return;

  analyser.getFloatTimeDomainData(data);
  const freq = autoCorrelate(data, audioCtx.sampleRate);

  if (freq !== -1) {
    const note = noteFromPitch(freq);
    document.getElementById("current").textContent = `当前音符：${note}`;

    const now = performance.now();

    if (note !== currentNote) {
      if (currentNote && now - noteStartTime >= STABLE_TIME) {
        melody.push({
          note: currentNote,
          duration: now - noteStartTime
        });
        renderMelody();
      }
      currentNote = note;
      noteStartTime = now;
    }
  }

  requestAnimationFrame(update);
}

function renderMelody() {
  const box = document.getElementById("melody");
  box.innerHTML = melody
    .map(n => `<span class="note">${n.note}</span>`)
    .join("");
}

document.getElementById("start").onclick = async () => {
  melody = [];
  currentNote = null;
  recording = true;
  document.getElementById("melody").innerHTML = "";

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioCtx.createMediaStreamSource(stream);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  data = new Float32Array(analyser.fftSize);

  source.connect(analyser);
  update();
};

document.getElementById("stop").onclick = () => {
  recording = false;
  const now = performance.now();
  if (currentNote) {
    melody.push({
      note: currentNote,
      duration: now - noteStartTime
    });
    renderMelody();
  }
};
</script>

</body>
</html>

</script>

</body>
</html>
