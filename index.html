
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哼唱旋律 → 拉小提琴</title>
<style>
body {
  font-family: system-ui, sans-serif;
  padding: 20px;
}
button {
  padding: 8px 14px;
  margin-right: 8px;
}
#current {
  font-size: 20px;
  margin: 12px 0;
}
.note {
  display: inline-block;
  padding: 4px 6px;
  margin: 2px;
  background: #e5e7eb;
  border-radius: 4px;
}
#hint {
  margin-top: 12px;
  opacity: 0.7;
}
</style>
</head>
<body>

<button id="record">🎤 开始录制旋律</button>
<button id="stop">⏹ 停止录制</button>
<button id="play">🎻 进入拉琴模式</button>

<div id="current">当前音调：-</div>
<div id="melody"></div>
<div id="hint">提示：进入拉琴模式后，左右移动鼠标 = 拉弓</div>

<script>
/* ---------- 工具函数 ---------- */
function freqToNoteInfo(freq) {
  const A4 = 440;
  const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const n = 12 * Math.log2(freq / A4) + 69;
  const r = Math.round(n);
  return { note: names[r % 12], cents: Math.round((n - r) * 100) };
}

function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length, rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;
  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE - i; j++)
      c[i] += buf[j] * buf[j + i];
  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let max = d;
  for (let i = d; i < SIZE; i++) if (c[i] > c[max]) max = i;
  return sampleRate / max;
}

/* ---------- 旋律录制 ---------- */
let audioCtx, analyser, data;
let melody = [];
let recording = false;
let currentFreq = null;
let startTime = 0;

function updatePitch() {
  if (!recording) return;
  analyser.getFloatTimeDomainData(data);
  const freq = autoCorrelate(data, audioCtx.sampleRate);
  if (freq > 60 && freq < 1200) {
    const info = freqToNoteInfo(freq);
    document.getElementById("current").textContent =
      `当前音调：${info.note}${info.cents ? " " + info.cents + "¢" : ""}`;
    const now = performance.now();
    if (!currentFreq || Math.abs(freq - currentFreq) / currentFreq > 0.05) {
      if (currentFreq) melody.push({ freq: currentFreq, dur: now - startTime });
      currentFreq = freq;
      startTime = now;
      renderMelody();
    }
  }
  requestAnimationFrame(updatePitch);
}

function renderMelody() {
  document.getElementById("melody").innerHTML =
    melody.map(n => {
      const i = freqToNoteInfo(n.freq);
      return `<span class="note">${i.note}</span>`;
    }).join("");
}

document.getElementById("record").onclick = async () => {
  melody = [];
  recording = true;
  audioCtx = new AudioContext();
  await audioCtx.resume();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  data = new Float32Array(analyser.fftSize);
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  updatePitch();
};

document.getElementById("stop").onclick = () => {
  recording = false;
  if (currentFreq)
    melody.push({ freq: currentFreq, dur: performance.now() - startTime });
  renderMelody();
};

/* ---------- 拉小提琴回放 ---------- */
let violinCtx, osc, gain, filter, lfo, lfoGain;
let playIndex = 0;
let noteStart = 0;
let lastX = null, lastTime = null;

document.getElementById("play").onclick = async () => {
  if (!melody.length) return alert("请先哼唱一段旋律");
  violinCtx = new AudioContext();
  await violinCtx.resume();
  playIndex = 0;
  noteStart = performance.now();
};

document.addEventListener("mousemove", e => {
  if (!violinCtx || playIndex >= melody.length) return;
  const now = performance.now();
  if (!lastTime) { lastTime = now; lastX = e.clientX; return; }
  const speed = Math.abs(e.clientX - lastX) / (now - lastTime);
  lastX = e.clientX;
  lastTime = now;

  if (speed > 0.15) {
    if (!osc) {
      osc = violinCtx.createOscillator();
      gain = violinCtx.createGain();
      filter = violinCtx.createBiquadFilter();
      lfo = violinCtx.createOscillator();
      lfoGain = violinCtx.createGain();

      osc.type = "sawtooth";
      filter.type = "bandpass";
      filter.frequency.value = 1200;

      lfo.frequency.value = 5.5;
      lfoGain.gain.value = melody[playIndex].freq * 0.01;
      lfo.connect(lfoGain).connect(osc.frequency);

      osc.connect(filter).connect(gain).connect(violinCtx.destination);
      gain.gain.value = 0;

      osc.start();
      lfo.start();
    }

    const note = melody[playIndex];
    osc.frequency.setTargetAtTime(note.freq, violinCtx.currentTime, 0.03);
    gain.gain.setTargetAtTime(Math.min(speed, 0.8), violinCtx.currentTime, 0.02);

    if (now - noteStart > note.dur) {
      playIndex++;
      noteStart = now;
    }
  } else if (osc) {
    gain.gain.setTargetAtTime(0, violinCtx.currentTime, 0.05);
  }
});
</script>

</body>
</html>
