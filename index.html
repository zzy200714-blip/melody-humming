
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D 自动演奏小提琴</title>
<style>
body { margin: 0; background: #0b0b0b; color: #eee; overflow: hidden; }
#ui {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.5);
  padding: 10px; border-radius: 8px;
  font-family: system-ui;
}
button { margin-right: 6px; }
</style>
</head>
<body>

<div id="ui">
  <button id="play">▶ 自动演奏</button>
  <span id="info">未开始</span>
</div>

<script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>

<script>
/* ---------------- 旋律（示例：可替换成你录的） ---------------- */
const melody = [
  { f: 440, d: 600 },
  { f: 493.88, d: 600 },
  { f: 523.25, d: 800 },
  { f: 587.33, d: 800 },
  { f: 659.25, d: 1200 }
];

/* ---------------- 音频系统 ---------------- */
let audioCtx, osc1, osc2, gain, filter;

function startSound() {
  audioCtx = new AudioContext();
  osc1 = audioCtx.createOscillator();
  osc2 = audioCtx.createOscillator();
  gain = audioCtx.createGain();
  filter = audioCtx.createBiquadFilter();

  osc1.type = "sawtooth";
  osc2.type = "triangle";
  filter.type = "bandpass";
  filter.frequency.value = 1200;

  gain.gain.value = 0;

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start();
  osc2.start();
}

let noteIndex = 0;
let noteStart = 0;

/* ---------------- Three.js 场景 ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0b);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.onresize = () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};

/* 灯光 */
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(5, 5, 5);
scene.add(light);

/* ---------------- 小提琴模型（程序生成） ---------------- */
const violin = new THREE.Group();
scene.add(violin);

/* 琴身 */
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.6, 0.7, 3, 32),
  new THREE.MeshStandardMaterial({ color: 0x5a2a12 })
);
body.rotation.z = Math.PI / 2;
violin.add(body);

/* 琴弦 */
const strings = [];
for (let i = 0; i < 4; i++) {
  const s = new THREE.Mesh(
    new THREE.CylinderGeometry(0.01, 0.01, 4),
    new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
  );
  s.position.y = -0.15 + i * 0.1;
  s.rotation.z = Math.PI / 2;
  violin.add(s);
  strings.push(s);
}

/* 弓 */
const bow = new THREE.Mesh(
  new THREE.BoxGeometry(4.5, 0.05, 0.05),
  new THREE.MeshStandardMaterial({ color: 0xdddddd })
);
bow.position.y = 0;
bow.position.z = 0.4;
scene.add(bow);

/* ---------------- 自动拉弓逻辑 ---------------- */
let bowPhase = 0;
let playing = false;

function animate(t) {
  requestAnimationFrame(animate);

  if (playing) {
    /* 弓往返 */
    bowPhase += 0.02;
    bow.position.x = Math.sin(bowPhase) * 1.5;

    /* 声音包络 */
    gain.gain.setTargetAtTime(0.4 + Math.abs(Math.sin(bowPhase)) * 0.3,
      audioCtx.currentTime, 0.05);

    /* 当前音符 */
    const now = performance.now();
    if (now - noteStart > melody[noteIndex].d) {
      noteIndex++;
      noteStart = now;
      if (noteIndex >= melody.length) {
        playing = false;
        gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
        info.textContent = "演奏结束";
      }
    }

    if (playing) {
      const f = melody[noteIndex].f;
      osc1.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.03);
      osc2.frequency.setTargetAtTime(f * 2, audioCtx.currentTime, 0.03);
    }

    /* 弦高亮 */
    strings.forEach(s => s.material.emissive?.setHex?.(0x000000));
    const si = noteIndex % 4;
    strings[si].material.emissive = new THREE.Color(0xffaa55);
  }

  renderer.render(scene, camera);
}

/* ---------------- 控制 ---------------- */
play.onclick = async () => {
  if (!audioCtx) startSound();
  await audioCtx.resume();
  noteIndex = 0;
  noteStart = performance.now();
  playing = true;
  info.textContent = "自动拉弓中…";
};

animate();
</script>

</body>
</html>
