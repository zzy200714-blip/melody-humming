<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>钢琴旋律演示</title>
<style>
body { background: #111; color: #eee; font-family: sans-serif; text-align:center; padding:50px;}
button { padding:10px 20px; margin:10px; font-size:16px; cursor:pointer;}
#notes {margin-top:30px; font-size:24px;}
.note { display:inline-block; padding:5px 10px; margin:3px; border-radius:4px; background:#333; transition:0.2s; }
.note.active { background:#f90; color:#000; font-weight:bold; }
</style>
</head>
<body>
<h1>钢琴旋律演示</h1>
<button id="play">▶ 播放旋律</button>
<div id="notes"></div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const actx = new AudioContext();

// 旋律序列
const melody = [
  {note:"B4", duration:600},
  {note:"A#4", duration:600},
  {note:"F4", duration:600},
  {note:"C4", duration:600},
  {note:"C4", duration:600},
  {note:"F#4", duration:600},
  {note:"C#4", duration:600},
  {note:"G4", duration:600},
  {note:"G4", duration:600},
];

// 创建音符显示
const notesDiv = document.getElementById('notes');
melody.forEach(n=>{
  const span = document.createElement('span');
  span.className = 'note';
  span.textContent = n.note;
  notesDiv.appendChild(span);
});

// 音名转频率
function noteToFreq(note){
  const noteMap = {C:0,C#:1,D:2,D#:3,E:4,F:5,F#:6,G:7,G#:8,A:9,A#:10,B:11};
  let octave = parseInt(note.slice(-1));
  let key = note.slice(0,-1);
  return 440 * Math.pow(2,(noteMap[key] + (octave-4)*12 - 9)/12);
}

// 播放旋律
async function playMelody(){
  const spans = document.querySelectorAll('.note');
  for(let i=0;i<melody.length;i++){
    const n = melody[i];
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = noteToFreq(n.note);

    // 钢琴包络 + 模拟延音
    gain.gain.setValueAtTime(0, actx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, actx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + n.duration/1000 + 0.2); // 延音0.2秒

    osc.connect(gain).connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + n.duration/1000 + 0.25);

    // 高亮当前音符
    spans.forEach(s=>s.classList.remove('active'));
    spans[i].classList.add('active');

    await new Promise(r=>setTimeout(r,n.duration));
  }
  // 播放完清除高亮
  document.querySelectorAll('.note').forEach(s=>s.classList.remove('active'));
}

document.getElementById("play").onclick = async ()=>{
  if(actx.state==="suspended") await actx.resume();
  playMelody();
};
</script>
</body>
</html>
