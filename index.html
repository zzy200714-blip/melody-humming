<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哼唱 → 钢琴旋律（最终稳定版）</title>
<style>
body{background:#111;color:#eee;font-family:sans-serif;text-align:center;padding:30px;}
button{padding:10px 18px;margin:5px;font-size:16px;cursor:pointer;}
#status{margin-top:10px;font-size:18px;color:#ff0;}
.note{display:inline-block;padding:5px 10px;margin:3px;border-radius:4px;background:#333;}
</style>
</head>
<body>

<h1>🎤 哼唱 → 🎹 钢琴旋律</h1>

<button id="start">开始录音</button>
<button id="stop">停止</button>
<button id="play">回放钢琴</button>

<div id="status">准备中</div>

<div>
  当前音符：<span id="currentNote">-</span><br>
  调式：<span id="currentScale">-</span><br>
  和弦：<span id="currentChord">-</span>
</div>

<div id="melody"></div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioContext();

const noteNames=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
let isRecording=false, stream;
let recordedMelody=[];

// ====== 稳定判定参数 ======
const MIN_RMS = 0.03;
const STABLE_FRAMES = 5;
const MIN_NOTE_MS = 200;

let lastNote=null;
let stableCount=0;
let lastNoteTime=0;

// ====== 音高检测 ======
function autoCorrelate(buf,sr){
  let rms=0;
  for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  if(rms<MIN_RMS) return null;

  let r=new Array(buf.length).fill(0);
  for(let t=0;t<buf.length;t++)
    for(let i=0;i<buf.length-t;i++)
      r[t]+=buf[i]*buf[i+t];

  let d=0; while(r[d]>r[d+1]) d++;
  let max=-1,pos=-1;
  for(let i=d;i<buf.length;i++)
    if(r[i]>max){max=r[i];pos=i;}

  return pos>0?sr/pos:null;
}

function freqToNote(freq){
  let midi=Math.round(12*Math.log2(freq/440)+69);
  return noteNames[midi%12]+Math.floor(midi/12);
}

// ====== 调式 / 和弦 ======
function guessScale(){
  const pitches=recordedMelody.map(n=>n.note.replace(/\d/,''));
  const scales={
    "C大调":["C","D","E","F","G","A","B"],
    "A小调":["A","B","C","D","E","F","G"]
  };
  let best="-",score=0;
  for(let k in scales){
    let s=0;
    pitches.forEach(p=>{if(scales[k].includes(p))s++;});
    if(s>score){score=s;best=k;}
  }
  return best;
}

function guessChord(){
  if(recordedMelody.length<3) return "-";
  const last=recordedMelody.slice(-3).map(n=>n.note.replace(/\d/,''));
  const chords={
    "C":["C","E","G"],
    "F":["F","A","C"],
    "G":["G","B","D"],
    "Am":["A","C","E"]
  };
  for(let c in chords)
    if(last.every(n=>chords[c].includes(n))) return c;
  return "-";
}

// ====== UI ======
function updateUI(){
  document.getElementById("melody").innerHTML=
    recordedMelody.map(n=>`<span class="note">${n.note}</span>`).join("");
  document.getElementById("currentScale").textContent=guessScale();
  document.getElementById("currentChord").textContent=guessChord();
}

// ====== 录音 ======
async function startRecording(){
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const source=ctx.createMediaStreamSource(stream);
  const analyser=ctx.createAnalyser();
  analyser.fftSize=2048;
  source.connect(analyser);
  const buf=new Float32Array(analyser.fftSize);

  recordedMelody=[];
  isRecording=true;
  lastNote=null; stableCount=0; lastNoteTime=performance.now();

  function loop(){
    if(!isRecording) return;
    analyser.getFloatTimeDomainData(buf);
    const pitch=autoCorrelate(buf,ctx.sampleRate);
    if(pitch){
      const note=freqToNote(pitch);
      document.getElementById("currentNote").textContent=note;

      if(note===lastNote) stableCount++;
      else stableCount=1;

      const now=performance.now();
      if(stableCount===STABLE_FRAMES && note!==lastNote && now-lastNoteTime>MIN_NOTE_MS){
        recordedMelody.push({note,duration:0});
        lastNote=note;
        lastNoteTime=now;
        updateUI();
      }
      if(recordedMelody.length>0)
        recordedMelody[recordedMelody.length-1].duration+=16;
    }
    requestAnimationFrame(loop);
  }
  loop();
}

// ====== 钢琴音色回放（多泛音） ======
function playNote(note,duration){
  const freq=440*Math.pow(2,(noteToMidi(note)-69)/12);
  const gain=ctx.createGain();
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0,ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration/1000);

  [1,2,3].forEach(h=>{
    const osc=ctx.createOscillator();
    osc.type="sine";
    osc.frequency.value=freq*h;
    osc.connect(gain);
    osc.start();
    osc.stop(ctx.currentTime+duration/1000+0.1);
  });
}

function noteToMidi(note){
  const map={C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
  return map[note.slice(0,-1)] + (parseInt(note.slice(-1))+1)*12;
}

// ====== 按钮 ======
document.getElementById("start").onclick=async()=>{
  document.getElementById("status").textContent="3…";
  await new Promise(r=>setTimeout(r,1000));
  document.getElementById("status").textContent="2…";
  await new Promise(r=>setTimeout(r,1000));
  document.getElementById("status").textContent="1…";
  await new Promise(r=>setTimeout(r,1000));
  document.getElementById("status").textContent="录音中";
  startRecording();
};

document.getElementById("stop").onclick=()=>{
  isRecording=false;
  stream.getTracks().forEach(t=>t.stop());
  document.getElementById("status").textContent="录音结束";
};

document.getElementById("play").onclick=async()=>{
  document.getElementById("status").textContent="回放中";
  for(const n of recordedMelody){
    playNote(n.note,n.duration);
    await new Promise(r=>setTimeout(r,n.duration));
  }
  document.getElementById("status").textContent="完成";
};
</script>
</body>
</html>
