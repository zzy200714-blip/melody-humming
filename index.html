
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>旋律播放示例</title>
<style>
body { background:#111; color:#eee; font-family:sans-serif; text-align:center; padding:50px;}
button { padding:10px 20px; margin:10px; font-size:16px; cursor:pointer;}
</style>
</head>
<body>
<h1>播放旋律 B A# F C C F# C# G G</h1>
<button id="play">▶ 播放旋律</button>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const actx = new AudioContext();

// 旋律
const melody = [
  {note:"B4", duration:600},
  {note:"A#4", duration:600},
  {note:"F4", duration:600},
  {note:"C4", duration:600},
  {note:"C4", duration:600},
  {note:"F#4", duration:600},
  {note:"C#4", duration:600},
  {note:"G4", duration:600},
  {note:"G4", duration:600},
];

// 音名转换为频率
const noteMap = {C:0,C#:1,D:2,D#:3,E:4,F:5,F#:6,G:7,G#:8,A:9,A#:10,B:11};
function noteToFreq(note){
  let octave=parseInt(note.slice(-1));
  let key=note.slice(0,-1);
  return 440*Math.pow(2,(noteMap[key]+(octave-4)*12-9)/12);
}

// 播放旋律
async function playMelody(){
  for(let i=0;i<melody.length;i++){
    const n = melody[i];
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type='sine'; // 钢琴音色
    osc.frequency.value = noteToFreq(n.note);

    gain.gain.setValueAtTime(0,actx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3,actx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+n.duration/1000);

    osc.connect(gain).connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime+n.duration/1000+0.05);

    await new Promise(r=>setTimeout(r,n.duration));
  }
}

document.getElementById("play").onclick=async ()=>{
  if(actx.state==="suspended") await actx.resume();
  playMelody();
};
</script>
</body>
</html>
