<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>麦克风权限测试</title>
</head>
<body>

<button id="start">点我请求麦克风</button>
<p id="status">等待点击</p>

<script>
document.getElementById("start").addEventListener("click", async () => {
  const status = document.getElementById("status");
  status.textContent = "正在请求权限...";

  try {
    // ⚠️ 直接请求，不创建 AudioContext
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    status.textContent = "🎤 权限已获取";
    console.log(stream);
  } catch (err) {
    status.textContent = "❌ 被拒绝：" + err.name;
    console.error(err);
  }
});
</script>

</body>
</html>
