<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哼唱 → 钢琴旋律（稳定最小版）</title>
<style>
body{
  background:#111;color:#eee;
  font-family:sans-serif;
  text-align:center;
  padding:30px;
}
button{
  padding:10px 18px;
  margin:5px;
  font-size:16px;
}
.note{
  display:inline-block;
  background:#333;
  padding:6px 10px;
  margin:4px;
  border-radius:4px;
}
#status{margin:10px;color:#0f0;}
</style>
</head>
<body>

<h1>🎤 哼唱 → 🎹 钢琴</h1>

<button id="start">开始录音</button>
<button id="stop">停止</button>
<button id="play">回放</button>

<div id="status">未开始</div>
<div id="melody"></div>

<script>
/* ================== 音频基础 ================== */
const AudioContext = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioContext();

const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

let stream, analyser, buffer;
let isRecording = false;
let melody = [];

let lastNote = null;
let lastTime = 0;

const MIN_RMS = 0.03;
const MIN_INTERVAL = 250; // ms

/* ================== 工具 ================== */
function freqToNote(freq){
  const midi = Math.round(12 * Math.log2(freq / 440) + 69);
  return noteNames[midi % 12] + Math.floor(midi / 12);
}

function noteToFreq(note){
  const map = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
  const pitch = note.slice(0,-1);
  const octave = parseInt(note.slice(-1));
  const midi = map[pitch] + (octave + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* ================== 音高检测（自相关） ================== */
function detectPitch(buf, sampleRate){
  let rms = 0;
  for (let i=0;i<buf.length;i++) rms += buf[i]*buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < MIN_RMS) return null;

  let bestOffset = -1;
  let bestCorr = 0;

  for (let offset=20; offset<1000; offset++){
    let corr = 0;
    for (let i=0;i<buf.length-offset;i++)
      corr += buf[i]*buf[i+offset];

    if (corr > bestCorr){
      bestCorr = corr;
      bestOffset = offset;
    }
  }
  return bestOffset > 0 ? sampleRate / bestOffset : null;
}

/* ================== 主循环 ================== */
function loop(){
  if (!isRecording) return;

  analyser.getFloatTimeDomainData(buffer);
  const freq = detectPitch(buffer, ctx.sampleRate);

  if (freq){
    const note = freqToNote(freq);
    const now = performance.now();

    if (note !== lastNote && now - lastTime > MIN_INTERVAL){
      melody.push(note);
      lastNote = note;
      lastTime = now;

      document.getElementById("melody").innerHTML =
        melody.map(n=>`<span class="note">${n}</span>`).join("");
    }
  }
  requestAnimationFrame(loop);
}

/* ================== 录音控制 ================== */
document.getElementById("start").onclick = async () => {
  if (ctx.state === "suspended") await ctx.resume();

  stream = await navigator.mediaDevices.getUserMedia({audio:true});
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  buffer = new Float32Array(analyser.fftSize);

  ctx.createMediaStreamSource(stream).connect(analyser);

  melody = [];
  lastNote = null;
  lastTime = 0;

  isRecording = true;
  document.getElementById("status").textContent = "🎤 正在录音";
  loop();
};

document.getElementById("stop").onclick = () => {
  isRecording = false;
  if (stream) stream.getTracks().forEach(t=>t.stop());
  document.getElementById("status").textContent = "已停止";
};

/* ================== 钢琴回放 ================== */
document.getElementById("play").onclick = async () => {
  document.getElementById("status").textContent = "▶ 回放中";

  for (const note of melody){
    const freq = noteToFreq(note);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);

    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+0.45);

    await new Promise(r=>setTimeout(r,450));
  }
  document.getElementById("status").textContent = "完成";
};
</script>
</body>
</html>
