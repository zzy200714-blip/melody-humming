
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哼唱旋律回放</title>
<style>
body {
  font-family: system-ui, sans-serif;
  padding: 24px;
}
button {
  margin-right: 10px;
  padding: 8px 14px;
}
#current {
  font-size: 22px;
  margin: 12px 0;
}
#melody {
  margin-top: 16px;
}
.note {
  display: inline-block;
  padding: 4px 6px;
  margin: 2px;
  border-radius: 4px;
  background: #e5e7eb;
}
</style>
</head>
<body>

<button id="start">开始录制</button>
<button id="stop">停止</button>
<button id="play">▶ 播放旋律</button>

<div id="current">当前音符：-</div>
<div id="melody"></div>

<script>
let audioCtx, analyser, data;
let recording = false;

let melody = [];
let currentNote = null;
let noteStartTime = 0;
const STABLE_TIME = 150;

function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;

  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) {
      c[i] += buf[j] * buf[j + i];
    }
  }

  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxpos = d;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > c[maxpos]) maxpos = i;
  }
  return sampleRate / maxpos;
}

function noteFromPitch(freq) {
  const A4 = 440;
  const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const n = Math.round(12 * Math.log2(freq / A4)) + 69;
  return names[n % 12];
}

function freqFromNote(note) {
  const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const n = names.indexOf(note);
  return 440 * Math.pow(2, (n - 9) / 12);
}

function update() {
  if (!recording) return;

  analyser.getFloatTimeDomainData(data);
  const freq = autoCorrelate(data, audioCtx.sampleRate);

  if (freq !== -1) {
    const note = noteFromPitch(freq);
    document.getElementById("current").textContent = `当前音符：${note}`;

    const now = performance.now();
    if (note !== currentNote) {
      if (currentNote && now - noteStartTime >= STABLE_TIME) {
        melody.push({ note: currentNote, duration: now - noteStartTime });
        renderMelody();
      }
      currentNote = note;
      noteStartTime = now;
    }
  }
  requestAnimationFrame(update);
}

function renderMelody() {
  document.getElementById("melody").innerHTML =
    melody.map(n => `<span class="note">${n.note}</span>`).join("");
}

document.getElementById("start").onclick = async () => {
  melody = [];
  currentNote = null;
  recording = true;
  document.getElementById("melody").innerHTML = "";

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioCtx.createMediaStreamSource(stream);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  data = new Float32Array(analyser.fftSize);

  source.connect(analyser);
  update();
};

document.getElementById("stop").onclick = () => {
  recording = false;
  const now = performance.now();
  if (currentNote) {
    melody.push({ note: currentNote, duration: now - noteStartTime });
    renderMelody();
  }
};

document.getElementById("play").onclick = async () => {
  if (melody.length === 0) return;

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();

  let t = ctx.currentTime;

  melody.forEach(n => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = "sawtooth";
    osc.frequency.value = freqFromNote(n.note);

    filter.type = "lowpass";
    filter.frequency.value = 1800;

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.6, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + n.duration / 1000);

    osc.connect(filter).connect(gain).connect(ctx.destination);

    osc.start(t);
    osc.stop(t + n.duration / 1000);

    t += n.duration / 1000;
  });
};
</script>

</body>
</html>
