
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哼唱旋律 → 3D 小提琴演奏</title>
<style>
body { margin:0; background:#0b0b0b; color:#eee; overflow:hidden; }
#ui {
  position:absolute; top:10px; left:10px;
  background:rgba(0,0,0,.6);
  padding:10px; border-radius:8px;
  font-family:system-ui;
}
button { margin-right:6px; }
</style>
</head>
<body>

<div id="ui">
  <button id="rec">🎤 哼唱定音</button>
  <button id="stop">⏹ 完成</button>
  <span id="info">未录制</span>
</div>

<script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>

<script>
/* ========== 音高工具 ========= */
function autoCorrelate(buf, sr) {
  let rms=0;
  for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  if(Math.sqrt(rms/buf.length)<0.01) return -1;
  let c=new Array(buf.length).fill(0);
  for(let i=0;i<buf.length;i++)
    for(let j=0;j<buf.length-i;j++)
      c[i]+=buf[j]*buf[j+i];
  let d=0;
  while(c[d]>c[d+1]) d++;
  let max=d;
  for(let i=d;i<buf.length;i++) if(c[i]>c[max]) max=i;
  return sr/max;
}

function freqToNote(f){
  const names=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  return names[Math.round(12*Math.log2(f/440)+69)%12];
}

function noteToFreq(n){
  const map={C:261.63,"C#":277.18,D:293.66,"D#":311.13,E:329.63,
             F:349.23,"F#":369.99,G:392,"G#":415.3,A:440,"A#":466.16,B:493.88};
  return map[n];
}

/* ========== 哼唱录音 ========= */
let audioCtx, analyser, data;
let recording=false, cur=null, t0=0;
let melody=[];

rec.onclick=async()=>{
  melody=[];
  audioCtx=new AudioContext();
  await audioCtx.resume();
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=2048;
  data=new Float32Array(analyser.fftSize);
  audioCtx.createMediaStreamSource(s).connect(analyser);
  recording=true;
  info.textContent="正在定音…";
  loop();
};

stop.onclick=()=>{
  recording=false;
  info.textContent="定音完成，可拉琴";
};

function loop(){
  if(!recording) return;
  analyser.getFloatTimeDomainData(data);
  const f=autoCorrelate(data,audioCtx.sampleRate);
  if(f>80&&f<1200){
    const n=freqToNote(f);
    if(n!==cur){
      melody.push(n);
      cur=n;
    }
  }
  requestAnimationFrame(loop);
}

/* ========== 音频演奏 ========= */
let ctx=new AudioContext();
let osc=ctx.createOscillator();
let gain=ctx.createGain();
osc.type="sawtooth";
gain.gain.value=0;
osc.connect(gain).connect(ctx.destination);
osc.start();
let idx=0;

/* ========== Three.js ========= */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0b0b);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
cam.position.set(0,2,6);
const r=new THREE.WebGLRenderer({antialias:true});
r.setSize(innerWidth,innerHeight);
document.body.appendChild(r.domElement);
window.onresize=()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  r.setSize(innerWidth,innerHeight);
};
scene.add(new THREE.AmbientLight(0xffffff,.4));
const l=new THREE.DirectionalLight(0xffffff,.8);
l.position.set(5,5,5); scene.add(l);

/* 小提琴 */
const v=new THREE.Group(); scene.add(v);
const body=new THREE.Mesh(
  new THREE.CylinderGeometry(.6,.7,3,32),
  new THREE.MeshStandardMaterial({color:0x5a2a12})
);
body.rotation.z=Math.PI/2; v.add(body);

/* 弦 */
const strings=[];
for(let i=0;i<4;i++){
  const s=new THREE.Mesh(
    new THREE.CylinderGeometry(.01,.01,4),
    new THREE.MeshStandardMaterial({color:0xaaaaaa})
  );
  s.position.y=-.15+i*.1;
  s.rotation.z=Math.PI/2;
  v.add(s); strings.push(s);
}

/* 弓 */
const bow=new THREE.Mesh(
  new THREE.BoxGeometry(4,.05,.05),
  new THREE.MeshStandardMaterial({color:0xdddddd})
);
bow.position.z=.5; scene.add(bow);

/* 演奏交互 */
let lastX=null;
document.addEventListener("mousemove",e=>{
  bow.position.x=(e.clientX/innerWidth-.5)*3;
  if(!melody.length) return;
  if(lastX===null){ lastX=e.clientX; return;}
  const speed=Math.abs(e.clientX-lastX);
  lastX=e.clientX;
  if(speed>3){
    const note=melody[idx%melody.length];
    osc.frequency.setTargetAtTime(noteToFreq(note),ctx.currentTime,.02);
    gain.gain.setTargetAtTime(.4,ctx.currentTime,.05);
    idx++;
  }else{
    gain.gain.setTargetAtTime(0,ctx.currentTime,.1);
  }
});

function animate(){
  requestAnimationFrame(animate);
  r.render(scene,cam);
}
animate();
</script>

</body>
</html>
